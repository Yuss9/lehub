name: LeHub - CI and GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint, TypeScript, unit tests and Next.js build
        run: docker build --pull -f Dockerfile.ci -t lehub-ci .
      - name: Check production image targets
        shell: bash
        run: |
          set -euo pipefail
          for target in runner worker migrate; do
            docker build --target "$target" -t "lehub-check:$target" .
          done

  build-publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, lehub-web]
    timeout-minutes: 90
    concurrency:
      group: lehub-ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare isolated Docker credentials
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/lehub-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$config_dir"
          chmod 700 "$config_dir"
          printf 'DOCKER_CONFIG=%s\n' "$config_dir" >> "$GITHUB_ENV"

      - name: Check NAS runner
        run: |
          set -euo pipefail
          printf 'Runner: %s; OS: %s; architecture: %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          test "$RUNNER_OS" = Linux
          command -v git
          docker version
          docker info --format 'Docker server: {{.OSType}}/{{.Architecture}}; CPUs: {{.NCPU}}; RAM: {{.MemTotal}}'
          test "$(docker info --format '{{.OSType}}')" = linux
          df -h "$RUNNER_TEMP"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint, TypeScript, unit tests and Next.js build
        run: |
          set -euo pipefail
          docker build --pull -f Dockerfile.ci \
            -t "lehub-ci:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .

      - name: Build all production images before publishing
        run: |
          set -euo pipefail
          for pair in 'runner lehub' 'worker lehub-worker' 'migrate lehub-migrate'; do
            read -r target image <<< "$pair"
            docker build --pull --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/Yuss9/lehub" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "ghcr.io/yuss9/$image:sha-$GITHUB_SHA" .
          done

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish commit images
        run: |
          set -euo pipefail
          for image in lehub lehub-worker lehub-migrate; do
            docker push "ghcr.io/yuss9/$image:sha-$GITHUB_SHA"
          done

      - name: Update latest after all commit images are published
        run: |
          set -euo pipefail
          for image in lehub lehub-worker lehub-migrate; do
            docker tag "ghcr.io/yuss9/$image:sha-$GITHUB_SHA" "ghcr.io/yuss9/$image:latest"
            docker push "ghcr.io/yuss9/$image:latest"
          done

      - name: Summarize publication
        run: |
          {
            printf '## Images published\n\n'
            for image in lehub lehub-worker lehub-migrate; do
              printf -- '- `ghcr.io/yuss9/%s:sha-%s` and `latest`\n' "$image" "$GITHUB_SHA"
            done
            printf '\nNo NAS deployment or database migration was executed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean credentials and job image tags
        if: always()
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/lehub-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -d "$config_dir" ]; then
            DOCKER_CONFIG="$config_dir" docker logout ghcr.io || true
            rm -f "$config_dir/config.json"
            rmdir "$config_dir" || true
          fi
          docker image rm "lehub-ci:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true
          for image in lehub lehub-worker lehub-migrate; do
            docker image rm "ghcr.io/yuss9/$image:sha-$GITHUB_SHA" || true
          done
