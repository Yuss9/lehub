# Install as /volume1/docker/github-runner-lehub/compose.yaml.
# Reuse the OneTask runner build recipe, never its registration/data.
services:
  github-runner-lehub:
    build:
      context: ../github-runner-onetask-web
    container_name: github-runner-lehub
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/Yuss9/lehub
      RUNNER_NAME: jarvis-lehub
      RUNNER_LABELS: lehub-web
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    volumes:
      - ./runner:/runner
      - /var/run/docker.sock:/var/run/docker.sock
