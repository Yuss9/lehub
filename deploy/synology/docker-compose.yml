# Model for /volume1/docker/web/docker-compose.yml. Review against the live file before replacing.
name: public-sites
services:
  sarah-portfolio:
    image: ghcr.io/yuss9/sarah-portfolio:latest
    container_name: sarah-portfolio
    restart: unless-stopped
    expose:
    - '3000'
    networks:
    - public-sites-network
    security_opt:
    - no-new-privileges:true
  theo-portfolio:
    image: ghcr.io/yuss9/theo-portfolio:latest
    container_name: theo-portfolio
    restart: unless-stopped
    expose:
    - '3000'
    networks:
    - public-sites-network
    security_opt:
    - no-new-privileges:true
  onetask-postgres:
    image: postgres:17-alpine
    container_name: onetask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onetask
      POSTGRES_USER: onetask
      POSTGRES_PASSWORD: ${ONETASK_POSTGRES_PASSWORD:?Set ONETASK_POSTGRES_PASSWORD
        in .env}
    volumes:
    - onetask-postgres-data:/var/lib/postgresql/data
    networks:
    - public-sites-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U onetask -d onetask
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
    - no-new-privileges:true
  onetask-landing-page:
    image: ghcr.io/yuss9/onetask-landing-page:latest
    container_name: onetask-landing-page
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://onetask:${ONETASK_POSTGRES_PASSWORD:?Set ONETASK_POSTGRES_PASSWORD
        in .env}@onetask-postgres:5432/onetask
    depends_on:
      onetask-postgres:
        condition: service_healthy
    expose:
    - '3000'
    networks:
    - public-sites-network
    healthcheck:
      test: &id001
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1)
        }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
    - no-new-privileges:true
  lehub-postgres:
    image: postgres:17-bookworm
    container_name: lehub-postgres
    restart: unless-stopped
    env_file:
    - ./lehub/postgres.env
    volumes:
    - lehub-postgres-data:/var/lib/postgresql/data
    networks:
    - lehub-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U lehub -d lehub_demo
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
    - no-new-privileges:true
  lehub-migrate:
    image: ghcr.io/yuss9/lehub-migrate:${LEHUB_IMAGE_TAG:-latest}
    env_file:
    - ./lehub/app.env
    networks:
    - lehub-network
    profiles:
    - lehub-tools
    depends_on:
      lehub-postgres:
        condition: service_healthy
    restart: 'no'
  lehub:
    image: ghcr.io/yuss9/lehub:${LEHUB_IMAGE_TAG:-latest}
    container_name: lehub
    restart: unless-stopped
    env_file:
    - ./lehub/app.env
    volumes:
    - lehub-documents:/app/data/documents
    expose:
    - '3000'
    networks:
    - public-sites-network
    - lehub-network
    depends_on:
      lehub-postgres:
        condition: service_healthy
    healthcheck:
      test: *id001
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
    - no-new-privileges:true
  lehub-worker:
    image: ghcr.io/yuss9/lehub-worker:${LEHUB_IMAGE_TAG:-latest}
    container_name: lehub-worker
    restart: unless-stopped
    env_file:
    - ./lehub/app.env
    environment:
      OCR_ENABLED: 'true'
      OCR_CONCURRENCY: '1'
      OCR_BATCH_SIZE: '5'
    volumes:
    - lehub-documents:/app/data/documents
    networks:
    - lehub-network
    depends_on:
      lehub-postgres:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
  caddy:
    image: caddy:2
    container_name: public-sites-caddy
    restart: unless-stopped
    depends_on:
    - sarah-portfolio
    - theo-portfolio
    - onetask-landing-page
    ports:
    - 192.168.1.95:8088:80/tcp
    - 192.168.1.95:8443:443/tcp
    - 192.168.1.95:8443:443/udp
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - ./caddy/data:/data
    - ./caddy/config:/config
    networks:
    - public-sites-network
    security_opt:
    - no-new-privileges:true
networks:
  public-sites-network:
    name: public-sites-network
    driver: bridge
  lehub-network:
    driver: bridge
volumes:
  onetask-postgres-data:
    name: onetask-postgres-data
  lehub-postgres-data:
    name: lehub-postgres-data
  lehub-documents:
    name: lehub-documents
